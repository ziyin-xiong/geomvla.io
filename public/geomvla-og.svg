<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="overlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e2b" stop-opacity="0.90" />
      <stop offset="0.52" stop-color="#111827" stop-opacity="0.76" />
      <stop offset="1" stop-color="#064e3b" stop-opacity="0.88" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff" />
  <image href="../src/assets/background.png" x="-258" y="0" width="1716" height="630" preserveAspectRatio="xMidYMid slice" />
  <rect width="1200" height="630" fill="url(#overlay)" />

  <g font-family="Helvetica Neue, Arial, sans-serif" filter="url(#shadow)">
    <rect x="324" y="62" width="154" height="50" rx="25" fill="#ffffff" opacity="0.18" />
    <text x="346" y="95" fill="#ffffff" font-size="27" font-weight="700" letter-spacing="2">CoRL 2026</text>

    <text x="324" y="205" fill="#6ee7b7" font-size="86" font-weight="800">GeomVLA</text>
    <text x="324" y="278" fill="#ffffff" font-size="44" font-weight="700">Unifying Scene,</text>
    <text x="324" y="334" fill="#ffffff" font-size="44" font-weight="700">Motion, and Action</text>
    <text x="324" y="390" fill="#ffffff" font-size="44" font-weight="700">in 3D</text>

    <text x="324" y="462" fill="#ffffff" font-size="26" font-weight="500" opacity="0.92">
      Scene motion guided robot actions.
    </text>
    <text x="324" y="500" fill="#ffffff" font-size="26" font-weight="500" opacity="0.86">
      3D-grounded. No robot-action pretraining.
    </text>

    <text x="324" y="555" fill="#ffffff" font-size="22" font-weight="500" opacity="0.88">
      Ziyin Xiong · Nikolaos Gkanatsios · Moritz Reuss · Katerina Fragkiadaki
    </text>

    <g transform="translate(324 582)">
      <rect x="0" y="0" width="322" height="44" rx="22" fill="#ffffff" opacity="0.94" />
      <text x="28" y="30" fill="#111827" font-size="20" font-weight="700">Paper · Code · arXiv · Slides</text>
    </g>
  </g>
</svg>
